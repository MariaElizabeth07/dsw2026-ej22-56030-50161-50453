<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio de Sesion</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="login_style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
      integrity="sha384-Bk5cbLkZQ5raZ0+H2/+VbfYx3WpvxvQK4zqXZr7sYODuaX7bKXoSOnipQxkaS8sv"
      crossorigin="anonymous"
    />
    <script src="login.js" defer></script>
  </head>
  <body>
    <div class="login-container">
      <div class="app-header">
        <div class="app-logo">
          <i class="bi bi-shield-plus"></i>
        </div>
        <h1 class="app-title">MedPortal</h1>
      </div>

      <form>
        <div class="header">
          <p>Bienvenido de nuevo</p>
          <p>Por favor, autentiquese para acceder al portal de proveedores.</p>
        </div>

        <div class="input-group">
          <label for="username">Nombre de Usuario:</label>
          <i class="bi bi-person-circle placeholder-icon"></i>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Ingrese ID de admin"
            required
          />
        </div>

        <div class="input-group">
          <label for="password">Contraseña:</label>
          <i class="bi bi-lock placeholder-icon"></i>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Ingrese la contraseña"
            required
          />
          <button class="eye-btn" type="button">
            <i class="bi bi-eye-fill"></i>
          </button>
        </div>

        <button type="submit">
          Iniciar Sesión <i class="bi bi-box-arrow-in-right"></i>
        </button>
      </form>
      <div class="footer">
        <i class="bi bi-shield-check"></i>
        <p>
          <strong>Solo Acceso seguro</strong>: Este sistema es para personal
          medico autorizado. Los intentos de acceso no autorizados son
          registrados y monitoreados para su cumplimiento.
        </p>
      </div>
    </div>
  </body>
</html>
