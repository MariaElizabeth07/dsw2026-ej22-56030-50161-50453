<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión - Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login_style.css">
</head>
<body>

  <main class="login-page">
    <div class="login-wrapper">

      <div class="login-brand">
        <div class="login-brand__icon">
          <img src="img/Group-39228-1.webp" alt="Logo de MedPortal">
        </div>
        <h1 class="login-brand__title">MedPortal</h1>
      </div>

      <!-- Card blanca -->
      <div class="login-card">
        <h2 class="login-card__title">Bienvenido de nuevo</h2>
        <p class="login-card__subtitle">
          Por favor, autentíquese para acceder al portal de proveedores.
        </p>

        <form id="loginForm" novalidate>

          <div class="form-group">
            <label for="username">Nombre de usuario</label>
            <div class="input-wrapper">
              <!-- ícono usuario -->
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
              </svg>
              <input type="text" id="username" name="username" placeholder="Ingrese ID de admin" required>
            </div>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">

              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="4" y="10" width="16" height="10" rx="2"/>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
              </svg>
              <input type="password" id="password" name="password" placeholder="••••••••" required>
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">
                <!-- ícono ojo -->
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="login-button">
            Iniciar Sesión
            <span aria-hidden="true">→</span>
          </button>

        </form>

        <div class="login-note">
          <svg class="login-note__icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5l-8-3Z"/>
          </svg>
          <p>
            <strong>Solo Acceso Seguro:</strong>
            Este sistema es para personal médico autorizado. Los intentos de acceso no autorizados son registrados y monitoreados para su cumplimiento.
          </p>
        </div>

      </div>
    </div>
  </main>

  <script src="login.js"></script>
</body>
</html>
